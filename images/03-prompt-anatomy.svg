<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Из чего складывается понятный запрос</title><desc id="desc">Чем яснее вход и критерий качества, тем проще проверить ответ.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#40536b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17253a}.head{font-size:28px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:16px;fill:#34445c}.note{font-size:17px;fill:#34445c}.card{stroke-width:2.5;rx:18;ry:18}.arrow{stroke:#40536b;stroke-width:3;marker-end:url(#a)}</style>
<rect width="1200" height="420" fill="#f6f8fc"/><text class="head" x="600" y="52" text-anchor="middle">Из чего складывается понятный запрос</text>
<rect class="card" x="60" y="125" width="196" height="175" fill="#eaf1ff" stroke="#2864dc"/>
<text class="name" x="158.0" y="165" text-anchor="middle">Задача</text>
<text class="body" x="158.0" y="203" text-anchor="middle">Что выполнить?</text>
<line class="arrow" x1="261" y1="212.5" x2="273" y2="212.5"/>
<rect class="card" x="281" y="125" width="196" height="175" fill="#e8f7ef" stroke="#278052"/>
<text class="name" x="379.0" y="165" text-anchor="middle">Контекст</text>
<text class="body" x="379.0" y="203" text-anchor="middle">Для кого и зачем?</text>
<line class="arrow" x1="482" y1="212.5" x2="494" y2="212.5"/>
<rect class="card" x="502" y="125" width="196" height="175" fill="#fff4df" stroke="#c58515"/>
<text class="name" x="600.0" y="165" text-anchor="middle">Материал</text>
<text class="body" x="600.0" y="203" text-anchor="middle">На чём работать?</text>
<line class="arrow" x1="703" y1="212.5" x2="715" y2="212.5"/>
<rect class="card" x="723" y="125" width="196" height="175" fill="#f2eaff" stroke="#8053b8"/>
<text class="name" x="821.0" y="165" text-anchor="middle">Условия</text>
<text class="body" x="821.0" y="203" text-anchor="middle">Тон, объём, запреты</text>
<line class="arrow" x1="924" y1="212.5" x2="936" y2="212.5"/>
<rect class="card" x="944" y="125" width="196" height="175" fill="#e7f6f8" stroke="#168094"/>
<text class="name" x="1042.0" y="165" text-anchor="middle">Проверка</text>
<text class="body" x="1042.0" y="203" text-anchor="middle">Формат и критерии</text>
<text class="note" x="600" y="360" text-anchor="middle">Чем яснее вход и критерий качества, тем проще проверить ответ.</text></svg>